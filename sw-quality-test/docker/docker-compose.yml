services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sw-quality-test-app
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sw_quality_test_shop
      DB_USER: root
      DB_PASS: 1234
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0.39
    container_name: sw-quality-test-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: sw_quality_test_shop
      TZ: Asia/Seoul
    volumes:
      - sw_quality_test_mysql:/var/lib/mysql
      - ../sql/DB_init.sql:/docker-entrypoint-initdb.d/01_DB_init.sql:ro
      - ../sql/TestData.sql:/docker-entrypoint-initdb.d/02_TestData.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: sw-quality-test-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 1234
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sw_quality_test_mysql:
