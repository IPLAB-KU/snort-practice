<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen bg-gray-100">

  <!-- 사이드바 -->
  <aside class="fixed left-0 top-0 h-full w-64 bg-gray-800 text-gray-100 flex flex-col">
    <div class="p-6 text-center border-b border-gray-700">
      <h1 class="text-xl font-bold tracking-wide">Admin Panel</h1>
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <a href="#" class="block px-4 py-2 rounded hover:bg-gray-700 transition">📦 상품 관리</a>
      <a href="#" class="block px-4 py-2 rounded hover:bg-gray-700 transition">📝 게시글 관리</a>
      <a href="#" class="block px-4 py-2 rounded hover:bg-gray-700 transition">👤 회원 관리</a>
      <a href="#" class="block px-4 py-2 rounded hover:bg-gray-700 transition">🧾 Log</a>
    </nav>
    <div class="p-4 border-t border-gray-700 text-center text-sm text-gray-400">
      © 2025 FleaMarket Admin
    </div>
  </aside>

  <!-- 메인 콘텐츠 -->
  <main class="flex-1 ml-64 p-8">
    <h2 class="text-2xl font-bold mb-6">대시보드</h2>
    <div class="grid grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="text-lg font-semibold mb-2">상품 수</h3>
        <p class="text-3xl font-bold text-blue-600">152</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="text-lg font-semibold mb-2">회원 수</h3>
        <p class="text-3xl font-bold text-green-600">87</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="text-lg font-semibold mb-2">게시글 수</h3>
        <p class="text-3xl font-bold text-indigo-600">43</p>
      </div>
    </div>
  </main>

</body>
</html>
